name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.6
          cache: true
      - run: go test ./... -count=1
      - run: go vet ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive: tar.gz
          - goos: linux
            goarch: arm64
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            archive: tar.gz
          - goos: windows
            goarch: amd64
            archive: zip
          - goos: windows
            goarch: arm64
            archive: zip
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.6
          cache: true
      - name: Validate release tag
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be semantic, for example v0.1.0: $VERSION" >&2
            exit 1
          fi
      - name: Build archive
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ARCHIVE_KIND: ${{ matrix.archive }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          asset="safelane-${VERSION}-${GOOS}-${GOARCH}"
          package_dir="dist/package"
          mkdir -p "$package_dir/safelane-skill"
          binary="safelane"
          if [[ "$GOOS" == "windows" ]]; then binary="safelane.exe"; fi
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "${package_dir}/${binary}" ./cmd/safelane
          cp LICENSE README.md "$package_dir/"
          cp internal/skill/SKILL.md "$package_dir/safelane-skill/SKILL.md"
          if [[ "$ARCHIVE_KIND" == "zip" ]]; then
            (cd "$package_dir" && zip -q "../${asset}.zip" "$binary" LICENSE README.md safelane-skill/SKILL.md)
          else
            tar -C "$package_dir" -czf "dist/${asset}.tar.gz" "$binary" LICENSE README.md safelane-skill/SKILL.md
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: safelane-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/safelane-*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          pattern: safelane-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: sha256sum safelane-* > checksums.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: gh release create "$VERSION" dist/* --verify-tag --generate-notes --title "$VERSION"
