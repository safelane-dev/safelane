name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.6
          cache: true
      - run: go test ./... -count=1
      - run: go vet ./...

  installer-unix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: sh scripts/test-installers.sh
      - run: bash scripts/test-cluster-bootstrap.sh

  installer-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - shell: pwsh
        run: ./scripts/test-installers.ps1
