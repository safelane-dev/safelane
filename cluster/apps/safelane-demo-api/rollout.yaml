apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: safelane-demo-api
  namespace: safelane-demo-api
  labels:
    safelane.dev/owned-demo: 'true'
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: safelane-demo-api
  strategy:
    canary:
      stableService: safelane-demo-api-stable
      canaryService: safelane-demo-api-canary
      # Background analysis, by reference. Nothing inline: the AnalysisTemplate
      # is a separate object this package owns, so SafeLane can read which
      # analysis guards the release without being able to rewrite it.
      analysis:
        templates:
          - templateName: success-rate
        args:
          - name: service-name
            value: safelane-demo-api-canary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: safelane-demo-api
    spec:
      containers:
      - name: api
        # No injected build identity. The revision this image was built from is
        # carried by the image itself, as immutable OCI metadata; an
        # environment variable in a manifest is mutable and goes stale the
        # moment the digest changes.
        image: ghcr.io/andrewmaged814/safelane-demo-api@${BASELINE_DIGEST}
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
